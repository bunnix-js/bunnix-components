name: Create draft release after staging

on:
  workflow_run:
    workflows: ['Stage npm package']
    types: [completed]
    branches: [main]

jobs:
  create-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > /tmp/release-tags
          if grep -Fxq "$TAG" /tmp/release-tags; then
            echo "Release $TAG already exists; leaving its state unchanged."
          else
            gh release create "$TAG" --draft --target "$RELEASE_SHA" \
              --title "Release $VERSION" \
              --notes "Awaiting manual npmjs.com approval with 2FA. Confirm npm publication and checksum before explicitly publishing this GitHub release. See docs/RELEASING.md."
          fi
